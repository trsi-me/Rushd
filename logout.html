<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Out</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0b2416;
        }

        .container {
            background: linear-gradient(135deg, #004d00, #007300);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.3);
            padding: 40px;
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 30px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        p {
            color: #ffffff;
            margin: 20px 0;
            font-size: 16px;
            opacity: 0.9;
        }

        a {
            display: inline-block;
            background: linear-gradient(90deg, #00ff6a, #00cc55);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        a:hover {
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.5);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Log Out</h1>
        <p>You have successfully logged out.</p>
        <a href="rushd login.html">Login Again</a>

    </div>
</body>

</html>
