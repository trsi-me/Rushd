<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense And Income Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <link rel="stylesheet" href="rushd.css">
</head>


<body>

    <div id="header">
        <div class="header-content">
            <span id="title">Rushd.</span>
            <div class="header-links">
                <span id="user-info" style="margin-right: 20px; font-size: 0.9rem;"></span>
                <a href="rushd login.html" id="login-link">login</a>
                <a href="register.html" id="register-link">Register</a>
                <a href="rushd.html">rushd</a>
                <a href="logout.html" id="logout-link" style="display: none;">Logout</a>
            </div>
            <div class="backend-label">MySQL/PHP Backend</div>
        </div>
    </div>

    <div id="dashboard">
        <div class="data-panel" id="expense-panel"><i class="fas fa-shopping-cart"></i>
            <div class="panel-label">Total Expense</div>
            <div id="expense-total" class="panel-value">--</div>
        </div>
        <div class="data-panel" id="income-panel"><i class="fas fa-money-bill-wave"></i>
            <div class="panel-label">Total Income</div>
            <div id="income-total" class="panel-value">--</div>
        </div>
        <div class="data-panel" id="total-panel"><i class="fas fa-chart-pie"></i>
            <div class="panel-label">Net Balance</div>
            <div id="balance-total" class="panel-value">--</div>
        </div>

        <div id="buttons">
            <button class="button" id="add-transaction"><i class="fas fa-plus"></i> Add Transaction</button>
        </div>
    </div>

    <div class="table-container">
        <h2 class="table-title">Transaction History</h2>
        <table id="transaction-table">
            <thead>
                <tr>
                    <th>TYPE</th>
                    <th>DESCRIPTION</th>
                    <th>CATEGORY</th>
                    <th id="amount-header">AMOUNT $<i class="fas fa-sort"></i></th>
                    <th>ACTION</th>
                </tr>
            </thead>

            <tbody id="transaction-body">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 40px; color: #9ca3af;">Loading transactions...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="add-transaction-dialog">
        <div id="dialog-title">Add Transaction</div>
        <div class="input-group">
            <label for="transaction-type">Type:</label>
            <select id="transaction-type">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
            </select>
        </div>
        <div class="input-group" id="category-group">
            <label for="transaction-category">Category (Expense Only):</label>
            <select id="transaction-category">
                <option value="Essential">Essential</option>
                <option value="Luxury">Luxury</option>
                <option value="Bills">Bills</option>
            </select>
        </div>
        <div class="input-group">
            <label for="transaction-description">Description:</label>
            <input type="text" id="transaction-description">
        </div>
        <div class="input-group">
            <label for="transaction-amount">Amount:</label>
            <input type="number" id="transaction-amount" step="0.01" min="0.01">
        </div>
        <div class="button-group">
            <button class="button" id="add-transaction-button">Add</button>
            <button class="button cancel" id="cancel-transaction-button">Cancel</button>
        </div>
    </div>


</body>


<script>
    // Global variables
    let transactions = [];
    let sortDirection = 'desc';

    // Load transactions from API on page load
    document.addEventListener('DOMContentLoaded', function () {
        checkAuth();
        loadTransactions();
        setupEventListeners();
    });

    // Check authentication status
    async function checkAuth() {
        try {
            const response = await fetch('check_auth.php');
            const result = await response.json();

            if (result.loggedIn) {
                document.getElementById('user-info').textContent = `Welcome, ${result.username}`;
                document.getElementById('login-link').style.display = 'none';
                document.getElementById('register-link').style.display = 'none';
                document.getElementById('logout-link').style.display = 'inline-block';
            } else {
                document.getElementById('user-info').textContent = '';
                document.getElementById('login-link').style.display = 'inline-block';
                document.getElementById('register-link').style.display = 'inline-block';
                document.getElementById('logout-link').style.display = 'none';
            }
        } catch (error) {
            console.error('Auth check error:', error);
        }
    }

    // Load transactions from API
    async function loadTransactions() {
        try {
            const response = await fetch('api.php', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            let result;
            try {
                result = await response.json();
            } catch (jsonError) {
                // If JSON parsing fails, it might be a PHP error
                const text = await response.text();
                throw new Error(`Server error (${response.status}): ${text.substring(0, 200)}`);
            }

            if (!response.ok) {
                // Show detailed error message from API
                const errorMsg = result.error || result.message || `HTTP error! status: ${response.status}`;
                throw new Error(errorMsg);
            }

            if (result.success && result.data) {
                transactions = result.data;
                renderTransactions();
                updateDashboard();
            } else {
                throw new Error(result.message || 'Failed to load transactions');
            }
        } catch (error) {
            console.error('Error loading transactions:', error);
            let errorMessage = '<div style="text-align: left; max-width: 600px; margin: 0 auto;">';
            errorMessage += '<h3 style="color: #ef4444; margin-bottom: 15px;">⚠️ Database Connection Error</h3>';

            // Check if it's a database connection error
            if (error.message && (error.message.includes('Database connection') || error.message.includes('Database'))) {
                errorMessage += '<p style="margin-bottom: 10px;"><strong>Problem:</strong> Cannot connect to MySQL database.</p>';
                errorMessage += '<p style="margin-bottom: 15px;"><strong>Solution:</strong></p>';
                errorMessage += '<ol style="text-align: left; margin-left: 20px;">';
                errorMessage += '<li style="margin-bottom: 8px;">Open <strong>XAMPP Control Panel</strong></li>';
                errorMessage += '<li style="margin-bottom: 8px;">Start <strong>MySQL</strong> service (click Start button)</li>';
                errorMessage += '<li style="margin-bottom: 8px;">Open <strong>phpMyAdmin</strong> (http://localhost/phpmyadmin)</li>';
                errorMessage += '<li style="margin-bottom: 8px;">Click <strong>Import</strong> tab</li>';
                errorMessage += '<li style="margin-bottom: 8px;">Select file: <strong>complete_database.sql</strong></li>';
                errorMessage += '<li style="margin-bottom: 8px;">Click <strong>Go</strong> button</li>';
                errorMessage += '<li style="margin-bottom: 8px;">Refresh this page</li>';
                errorMessage += '</ol>';
                errorMessage += '<p style="margin-top: 15px; font-size: 0.9em; color: #6b7280;">Error: ' + error.message + '</p>';
            } else {
                errorMessage += '<p><strong>Error:</strong> ' + (error.message || 'Unknown error occurred') + '</p>';
                errorMessage += '<p style="margin-top: 10px;">Please check the browser console for more details.</p>';
            }
            errorMessage += '</div>';

            document.getElementById('transaction-body').innerHTML =
                '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #ef4444;">' + errorMessage + '</td></tr>';
        }
    }

    // Render transactions table
    function renderTransactions() {
        const tbody = document.getElementById('transaction-body');

        if (transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #9ca3af;">No transactions recorded yet.</td></tr>';
            return;
        }

        tbody.innerHTML = transactions.map((transaction, index) => {
            const typeClass = transaction.type === 'Expense' ? 'expense-type' : 'income-type';
            return `
                <tr>
                    <td><span class="${typeClass}">${transaction.type}</span></td>
                    <td>${transaction.description || '-'}</td>
                    <td>${transaction.category || '-'}</td>
                    <td>$${parseFloat(transaction.amount).toFixed(2)}</td>
                    <td class="remove-icon">
                        <button class="delete-button" data-transaction-id="${transaction.id}">
                            <i class="fas fa-trash"></i>Delete
                        </button>
                    </td>
                </tr>
            `;
        }).join('');

        // Attach delete listeners
        attachDeleteListeners();
    }

    // Update dashboard totals
    function updateDashboard() {
        let totalExpense = 0;
        let totalIncome = 0;

        transactions.forEach(transaction => {
            const amount = parseFloat(transaction.amount);
            if (transaction.type === 'Expense') {
                totalExpense += amount;
            } else if (transaction.type === 'Income') {
                totalIncome += amount;
            }
        });

        const netBalance = totalIncome - totalExpense;

        document.getElementById('expense-total').textContent = '$' + totalExpense.toFixed(2);
        document.getElementById('income-total').textContent = '$' + totalIncome.toFixed(2);
        const balanceEl = document.getElementById('balance-total');
        balanceEl.textContent = '$' + netBalance.toFixed(2);
        balanceEl.style.color = netBalance >= 0 ? '#10b981' : '#ef4444';
    }

    // Setup event listeners
    function setupEventListeners() {
        // Show dialog
        document.getElementById('add-transaction').addEventListener('click', function () {
            document.getElementById('add-transaction-dialog').style.display = 'block';
        });

        // Hide dialog
        document.getElementById('cancel-transaction-button').addEventListener('click', function () {
            document.getElementById('add-transaction-dialog').style.display = 'none';
            resetForm();
        });

        // Add transaction
        document.getElementById('add-transaction-button').addEventListener('click', handleAddTransaction);

        // Category visibility toggle
        document.getElementById('transaction-type').addEventListener('change', function () {
            const categoryGroup = document.getElementById('category-group');
            categoryGroup.style.display = this.value === 'Expense' ? 'block' : 'none';
        });

        // Amount header sorting
        document.getElementById('amount-header').addEventListener('click', sortByAmount);
    }

    // Handle add transaction
    async function handleAddTransaction() {
        const type = document.getElementById('transaction-type').value;
        const description = document.getElementById('transaction-description').value.trim();
        const amount = document.getElementById('transaction-amount').value;
        const category = document.getElementById('transaction-category').value;

        if (!description) {
            alert('Please enter a description');
            return;
        }

        if (!amount || parseFloat(amount) <= 0) {
            alert('Please enter a valid amount greater than 0');
            return;
        }

        const transactionData = {
            type: type,
            description: description,
            amount: parseFloat(amount),
            category: type === 'Expense' ? category : null
        };

        try {
            const response = await fetch('api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(transactionData)
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('add-transaction-dialog').style.display = 'none';
                resetForm();
                loadTransactions(); // Reload transactions
            } else {
                alert('Error: ' + (result.message || 'Failed to add transaction'));
            }
        } catch (error) {
            console.error('Error adding transaction:', error);
            alert('Failed to add transaction. Please try again.');
        }
    }

    // Attach delete listeners
    function attachDeleteListeners() {
        document.querySelectorAll('.delete-button').forEach(function (button) {
            button.addEventListener('click', function () {
                const id = this.getAttribute('data-transaction-id');
                if (confirm('Are you sure you want to delete this transaction?')) {
                    deleteTransaction(id);
                }
            });
        });
    }

    // Delete transaction
    async function deleteTransaction(id) {
        try {
            const response = await fetch('api.php', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            });

            const result = await response.json();

            if (result.success) {
                loadTransactions(); // Reload transactions
            } else {
                alert('Error: ' + (result.message || 'Failed to delete transaction'));
            }
        } catch (error) {
            console.error('Error deleting transaction:', error);
            alert('Failed to delete transaction. Please try again.');
        }
    }

    // Sort by amount
    function sortByAmount() {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';

        transactions.sort((a, b) => {
            const amountA = parseFloat(a.amount);
            const amountB = parseFloat(b.amount);
            return sortDirection === 'asc' ? amountA - amountB : amountB - amountA;
        });

        renderTransactions();

        // Update header icon
        const header = document.getElementById('amount-header');
        const icon = header.querySelector('i');
        icon.className = sortDirection === 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down';
    }

    // Reset form
    function resetForm() {
        document.getElementById('transaction-type').value = 'Expense';
        document.getElementById('transaction-description').value = '';
        document.getElementById('transaction-amount').value = '';
        document.getElementById('transaction-category').value = 'Essential';
        document.getElementById('category-group').style.display = 'block';
    }

    // Logout handler
    document.getElementById('logout-link')?.addEventListener('click', function (e) {
        e.preventDefault();
        fetch('logout.php')
            .then(() => {
                window.location.href = 'rushd login.html';
            });
    });
</script>

</html>
